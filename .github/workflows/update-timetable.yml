name: Update Timetable Daily

on:
  schedule:
    # Run every day at 6:00 AM Malaysia Time (UTC+8, which is 22:00 UTC previous day)
    - cron: '0 22 * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set timezone
        run: sudo timedatectl set-timezone Asia/Kuala_Lumpur
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm install
        
      - name: Generate timetables
        env:
          TARUMT_USERNAME: ${{ secrets.TARUMT_USERNAME }}
          TARUMT_PASSWORD: ${{ secrets.TARUMT_PASSWORD }}
        run: |
          mkdir -p public
          node generateTimetable.js
          mv timetable_*.ics public/
          
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
