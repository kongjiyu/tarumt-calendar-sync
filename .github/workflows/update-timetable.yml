name: Update Timetable Daily

on:
  schedule:
    # Run every day at 6:23 AM Malaysia Time (UTC+8, which is 22:23 UTC previous day)
    - cron: '23 22 * * *'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Asia/Kuala_Lumpur

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate timetables
        env:
          TARUMT_USERNAME: ${{ secrets.TARUMT_USERNAME }}
          TARUMT_PASSWORD: ${{ secrets.TARUMT_PASSWORD }}
        run: |
          node -v
          mkdir -p public
          node generateTimetable.js
          for file in timetable.ics timetable_normal.ics timetable_holidays.ics timetable_replacements.ics timetable_exams.ics; do
            test -s "$file"
            mv "$file" public/
          done

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
